<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="236" viewBox="0 0 1600 236" role="img" aria-label="The eight style families">
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .fx { fill: #8B8E93; }
      .ess { fill: #8B8E93; }
      .rule { stroke: #8B8E93; stroke-opacity: 0.35; }
      .sw { stroke: #8B8E93; stroke-opacity: 0.35; }
    </style>
    <linearGradient id="atm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ec9d8"/><stop offset="0.55" stop-color="#7a6cf0"/><stop offset="1" stop-color="#e86aa6"/></linearGradient>
    <linearGradient id="print" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f27bb4"/><stop offset="0.55" stop-color="#e2493f"/><stop offset="1" stop-color="#7a4ec9"/></linearGradient>
  </defs>
  <!-- 8 columns, 200 wide, hairline separated; transparent background so it sits on both themes -->
  <g class="rule" stroke-width="1">
    <line x1="0.5" y1="0" x2="0.5" y2="236"/>
    <line x1="200.5" y1="0" x2="200.5" y2="236"/>
    <line x1="400.5" y1="0" x2="400.5" y2="236"/>
    <line x1="600.5" y1="0" x2="600.5" y2="236"/>
    <line x1="800.5" y1="0" x2="800.5" y2="236"/>
    <line x1="1000.5" y1="0" x2="1000.5" y2="236"/>
    <line x1="1200.5" y1="0" x2="1200.5" y2="236"/>
    <line x1="1400.5" y1="0" x2="1400.5" y2="236"/>
    <line x1="1599.5" y1="0" x2="1599.5" y2="236"/>
    <line x1="0" y1="0.5" x2="1600" y2="0.5"/>
    <line x1="0" y1="235.5" x2="1600" y2="235.5"/>
  </g>

  <!-- F1 -->
  <g transform="translate(20 28)">
    <text class="mono fx" font-size="11" letter-spacing="1.2" y="0">F1</text>
    <text class="sans" font-size="15" font-weight="600" fill="#8B8E93" y="26">Editorial Monochrome</text>
    <g transform="translate(0 44)" class="sw"><rect width="28" height="18" fill="#0A0C10"/><rect x="32" width="28" height="18" fill="#15181D"/><rect x="64" width="28" height="18" fill="#8b8e93"/><rect x="96" width="28" height="18" fill="#EDEDED"/><rect x="128" width="28" height="18" fill="#3B82F6"/></g>
    <text class="sans ess" font-size="12" y="94">Dark, divider-cut, type</text>
    <text class="sans ess" font-size="12" y="112">does the work · 14 refs</text>
    <text class="mono ess" font-size="10" y="146" letter-spacing="0.5">Linear · Vercel · Attio</text>
  </g>
  <!-- F2 -->
  <g transform="translate(220 28)">
    <text class="mono fx" font-size="11" letter-spacing="1.2" y="0">F2</text>
    <text class="sans" font-size="15" font-weight="600" fill="#8B8E93" y="26">Ink &amp; Air</text>
    <g transform="translate(0 44)" class="sw"><rect width="28" height="18" fill="#F7F7F7"/><rect x="32" width="28" height="18" fill="#FFFFFF"/><rect x="64" width="28" height="18" fill="#6B7280"/><rect x="96" width="28" height="18" fill="#3A3A3A"/><rect x="128" width="28" height="18" fill="#3770E9"/></g>
    <text class="sans ess" font-size="12" y="94">Airy light editorial,</text>
    <text class="sans ess" font-size="12" y="112">charcoal ink, one accent · 10</text>
    <text class="mono ess" font-size="10" y="146" letter-spacing="0.5">Stripe · Vercel light</text>
  </g>
  <!-- F3 -->
  <g transform="translate(420 28)">
    <text class="mono fx" font-size="11" letter-spacing="1.2" y="0">F3</text>
    <text class="sans" font-size="15" font-weight="600" fill="#8B8E93" y="26">Staged Atmosphere</text>
    <g transform="translate(0 44)" class="sw"><rect width="28" height="18" fill="#101013"/><rect x="32" width="60" height="18" fill="url(#atm)"/><rect x="96" width="28" height="18" fill="#EDEDEE"/><rect x="128" width="28" height="18" fill="#C0A0EC"/></g>
    <text class="sans ess" font-size="12" y="94">One chroma asset carries</text>
    <text class="sans ess" font-size="12" y="112">the mood, UI stays gray · 15</text>
    <text class="mono ess" font-size="10" y="146" letter-spacing="0.5">Raycast · Reflect</text>
  </g>
  <!-- F4 -->
  <g transform="translate(620 28)">
    <text class="mono fx" font-size="11" letter-spacing="1.2" y="0">F4</text>
    <text class="sans" font-size="15" font-weight="600" fill="#8B8E93" y="26">Blueprint Sheet</text>
    <g transform="translate(0 44)" class="sw"><rect width="28" height="18" fill="#050505"/><rect x="32" width="28" height="18" fill="#454545"/><rect x="64" width="28" height="18" fill="#a9e494"/><rect x="96" width="28" height="18" fill="#c25b52"/><rect x="128" width="28" height="18" fill="#dcc17e"/></g>
    <text class="sans ess" font-size="12" y="94">Drafting-table ornament:</text>
    <text class="sans ess" font-size="12" y="112">grid, FIG labels, redlines · 9</text>
    <text class="mono ess" font-size="10" y="146" letter-spacing="0.5">Prime Intellect · interfaces.dev</text>
  </g>
  <!-- F5 -->
  <g transform="translate(820 28)">
    <text class="mono fx" font-size="11" letter-spacing="1.2" y="0">F5</text>
    <text class="sans" font-size="15" font-weight="600" fill="#8B8E93" y="26">Paper &amp; Print</text>
    <g transform="translate(0 44)" class="sw"><rect width="28" height="18" fill="#FFFFFF"/><rect x="32" width="28" height="18" fill="#ECECEC"/><rect x="64" width="28" height="18" fill="#3B3B3B"/><rect x="96" width="60" height="18" fill="url(#print)"/></g>
    <text class="sans ess" font-size="12" y="94">Halftone, crop marks,</text>
    <text class="sans ess" font-size="12" y="112">paper grain, white mats · 5</text>
    <text class="mono ess" font-size="10" y="146" letter-spacing="0.5">studio brand boards</text>
  </g>
  <!-- F6 -->
  <g transform="translate(1020 28)">
    <text class="mono fx" font-size="11" letter-spacing="1.2" y="0">F6</text>
    <text class="sans" font-size="15" font-weight="600" fill="#8B8E93" y="26">Soft Pastel Stage</text>
    <g transform="translate(0 44)" class="sw"><rect width="28" height="18" fill="#DBF3FF"/><rect x="32" width="28" height="18" fill="#F0F5FE"/><rect x="64" width="28" height="18" fill="#77dbff"/><rect x="96" width="28" height="18" fill="#eea733"/><rect x="128" width="28" height="18" fill="#2349DA"/></g>
    <text class="sans ess" font-size="12" y="94">Pastel fields, squircles,</text>
    <text class="sans ess" font-size="12" y="112">one soft shadow · 6</text>
    <text class="mono ess" font-size="10" y="146" letter-spacing="0.5">Amie · Luma</text>
  </g>
  <!-- F7 -->
  <g transform="translate(1220 28)">
    <text class="mono fx" font-size="11" letter-spacing="1.2" y="0">F7</text>
    <text class="sans" font-size="15" font-weight="600" fill="#8B8E93" y="26">Tactile Instruments</text>
    <g transform="translate(0 44)" class="sw"><rect width="28" height="18" fill="#F2F1EE"/><rect x="32" width="28" height="18" fill="#1F2326"/><rect x="64" width="28" height="18" fill="#FF9C28"/><rect x="96" width="28" height="18" fill="#10B981"/></g>
    <text class="sans ess" font-size="12" y="94">Components as hardware:</text>
    <text class="sans ess" font-size="12" y="112">dials, wheels, 1:1 drag · 8</text>
    <text class="mono ess" font-size="10" y="146" letter-spacing="0.5">Rauno · Emil demos</text>
  </g>
  <!-- F8 -->
  <g transform="translate(1420 28)">
    <text class="mono fx" font-size="11" letter-spacing="1.2" y="0">F8</text>
    <text class="sans" font-size="15" font-weight="600" fill="#8B8E93" y="26">Emissive Signal</text>
    <g transform="translate(0 44)" class="sw"><rect width="28" height="18" fill="#08080A"/><rect x="32" width="28" height="18" fill="#4D9FFF"/><rect x="64" width="28" height="18" fill="#E921B8"/><rect x="96" width="28" height="18" fill="#22C55E"/></g>
    <text class="sans ess" font-size="12" y="94">Near-dark, light as the</text>
    <text class="sans ess" font-size="12" y="112">accent, bloom at action · 8</text>
    <text class="mono ess" font-size="10" y="146" letter-spacing="0.5">Linear release films</text>
  </g>
</svg>
