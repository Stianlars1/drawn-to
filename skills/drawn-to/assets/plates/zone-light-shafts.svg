  .w{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:8px;fill:#8B8E93;fill-opacity:.75;letter-spacing:.08em}
 </style><clipPath id="fb"><rect x="84.0" y="48.0" width="600.0" height="450.0"/></clipPath><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#5B8CFF"/></marker></defs>
 <text class="mt" x="24" y="18">LIGHT SHAFTS / TYPE INSIDE THE LIGHT</text>
 <text class="m" x="24" y="34">centred spine - the field owns the page - one hue at full energy</text>
 <text class="w" x="744" y="18" text-anchor="end">LAYOUT DIAGRAM - GEOMETRY ONLY</text>
 <text class="w" x="744" y="32" text-anchor="end">geometry, not style</text>
