 <rect class="d" x="84.0" y="48.0" width="600.0" height="450.0" rx="0"/>
 <text class="m" x="90.0" y="61.0">field box 1200 wide on a 1440 viewport - the shafts die before the edges</text>
 <line class="a" x1="644.0" y1="123.0" x2="549.0" y2="213.0" marker-end="url(#ah)"/>
 <text class="m" x="644.0" y="114.0" text-anchor="end">one direction ~55 deg, dithered falloff</text>
 <rect class="b" x="249.0" y="248.0" width="270.0" height="31.0" rx="1"/>
 <rect class="b" x="274.0" y="288.0" width="220.0" height="31.0" rx="1"/>
 <text class="m" x="249.0" y="244.0">H1 64 / 600 - lh 1.1 - centred ON the shafts, no scrim</text>
 <rect class="bl" x="249.0" y="348.0" width="270.0" height="8.0" rx="1"/>
 <text class="m" x="249.0" y="344.0">sub 18 / 400</text>
 <rect class="b" x="285.0" y="428.0" width="86.5" height="18.0" rx="9.0"/>
 <rect class="b" x="379.5" y="428.0" width="103.5" height="18.0" rx="9.0"/>
 <text class="m" x="249.0" y="457.0">pills 36 - r 8 - ring 0 0 0 2px rgba(0,0,0,.5)</text>
 <text class="m" x="249.0" y="471.0">+ glow 0 0 14px rgba(255,255,255,.19)</text>
 <text class="m" x="674.0" y="485.0" text-anchor="end">type placed where the shafts are already dark</text>
 <rect class="r" x="24" y="48" width="720" height="450"/>
 <text class="m" x="24" y="568">1440 x 900 - the frame IS the fold</text>
 <text class="m" x="744" y="568" text-anchor="end">T4 raw WebGL, container width</text>
