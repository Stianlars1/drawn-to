name: validate-library
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Validate the taste library
        run: python3 scripts/validate-library.py
      - name: Verify direct and quoted-article media extraction
        run: python3 scripts/test-fetch-media.py
      - name: Verify generated showcase counts
        run: python3 scripts/build-showcase-data.py --check
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Verify atomic contracts and generated generator catalog
        run: node scripts/build-generator.mjs --check
      - name: Test generator selection, handoff and persistence
        run: node --test tests/generator/*.test.mjs
      - name: Verify generated showcase prompts
        run: node scripts/build-showcase-prompts.mjs --check
