/* =====================================================================
   Drawn To - one screen, one content model, nine locked directions.
   Locks: docs/design-locks/2026-08-21-drawn-to-site.md (revisions R1, R2)
   ===================================================================== */
:root{
  --sans:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono","SF Mono",Menlo,Consolas,monospace;
  --serif:"Instrument Serif",Georgia,serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --success:#35C56A;
}
/* ---------- A · narrow dark sharp (F1 80 + F4 15 + F8 5) ---------- */
[data-variant="a"]{
  --bg:#0A0C10;--surface:#0F1217;--ink1:#EDEDEE;--ink2:#8B8E93;--ink3:#5D5E63;
  --rule:rgba(255,255,255,.08);--rule-hot:rgba(255,255,255,.16);--wash:rgba(255,255,255,.06);
  --accent:#5B8CFF;--col:1120px;--pad:28px;--r:0;
  --display-w:500;--display-track:-.025em;
}
/* ---------- B · wide light pastel (F6 70 + F3 30) ---------- */
[data-variant="b"]{
  --bg:#F4F6FB;--surface:#FFFFFF;--ink1:#1B2A50;--ink2:#5E6A8A;--ink3:#8E97B3;
  --rule:rgba(27,42,80,.08);--rule-hot:rgba(27,42,80,.14);--wash:rgba(27,42,80,.05);
  --accent:#2349DA;--col:1400px;--pad:32px;--r:28px;
  --display-w:500;--display-track:-.03em;
}
/* ---------- C · paper & print (F5 70 + F4 30) ---------- */
[data-variant="c"]{
  --bg:#F3F2EE;--surface:#FFFFFF;--ink1:#2E2E2E;--ink2:#6B6B6B;--ink3:#9C9A94;
  --rule:#E3E1DB;--rule-hot:#C9C6BD;--wash:#EFEDE7;
  --accent:#7A4EC9;--col:1200px;--pad:32px;--r:0;
  --display-w:400;--display-track:-.01em;
}
/* ---------- D · dark atmosphere, one light (F3 60 + F8 25 + F1 15) ---------- */
[data-variant="d"]{
  --bg:#05070A;--surface:rgba(255,255,255,.04);--ink1:#F2F4F6;--ink2:#8C949E;--ink3:#5A6370;
  --rule:rgba(255,255,255,.08);--rule-hot:rgba(255,255,255,.16);--wash:rgba(255,255,255,.06);
  --accent:#35C9D6;--col:1232px;--pad:28px;--r:12px;
  --display-w:600;--display-track:-.025em;
}
/* ---------- E · Vercel-home (F1-wide 85 + F8 15) ---------- */
[data-variant="e"]{
  --bg:#000;--surface:#0A0A0A;--ink1:#EDEDED;--ink2:#A1A1A1;--ink3:#666;
  --rule:rgba(255,255,255,.10);--rule-hot:rgba(255,255,255,.18);--wash:rgba(255,255,255,.07);
  --accent:#fff;--col:1400px;--pad:24px;--r:6px;
  --display-w:500;--display-track:-.06em;
}
/* ---------- F · ink & air (F2 85 + F4 15) ---------- */
[data-variant="f"]{
  --bg:#FAFAFA;--surface:#FFFFFF;--ink1:#3A3A3A;--ink2:#6B7280;--ink3:#9AA0A8;
  --rule:#E8E8E8;--rule-hot:#DBDBDB;--wash:#F1F1F1;
  --accent:#3770E9;--col:1200px;--pad:40px;--r:10px;
  --display-w:600;--display-track:-.022em;
}
/* ---------- G · isometric blueprint (F4 75 + F1 25) ---------- */
[data-variant="g"]{
  --bg:#1A1A1C;--surface:#131315;--ink1:#EDEDEE;--ink2:#8A8A8E;--ink3:#5A5A5E;
  --rule:rgba(255,255,255,.09);--rule-hot:rgba(255,255,255,.17);--wash:rgba(255,255,255,.06);
  --accent:#FFFFFF;--col:1280px;--pad:32px;--r:0;
  --display-w:500;--display-track:-.025em;
}
/* ---------- H · emissive signal (F8 80 + F1 20) ---------- */
[data-variant="h"]{
  --bg:#08080A;--surface:#0C0C0F;--ink1:#C6C6CE;--ink2:#5E5E68;--ink3:#43434C;
  --rule:rgba(255,255,255,.06);--rule-hot:rgba(255,255,255,.11);--wash:rgba(255,255,255,.05);
  --accent:#FFB43C;--col:1120px;--pad:28px;--r:8px;
  --display-w:500;--display-track:-.03em;
}
/* ---------- I · tactile instrument (F7 70 + F2 30) ---------- */
[data-variant="i"]{
  --bg:#F2F1EE;--surface:#FBFAF7;--ink1:#1F2326;--ink2:#6A6E71;--ink3:#9B9C99;
  --rule:#DEDCD5;--rule-hot:#CBC8BF;--wash:#E9E7E0;
  --accent:#E8622A;--col:1120px;--pad:32px;--r:14px;
  --display-w:500;--display-track:-.028em;
}

/* ---------- 21 · proof diptych (comparison · dark) ---------- */
[data-variant="u"]{--bg:#0A0A0C;--surface:#101013;--ink1:#EDEDEE;--ink2:#8A8D92;--ink3:#5A5C61;
  --rule:rgba(255,255,255,.09);--rule-hot:rgba(255,255,255,.17);--wash:rgba(255,255,255,.06);
  --accent:#5B8CFF;--col:1240px;--pad:28px;--r:0;--display-w:500;--display-track:-.03em}
/* ---------- 22 · the refusals (ledger · light) ---------- */
[data-variant="v"]{--bg:#F6F5F1;--surface:#FFFFFF;--ink1:#26251F;--ink2:#67655D;--ink3:#9D9A90;
  --rule:#E2DFD6;--rule-hot:#CBC7BB;--wash:#EDEBE4;
  --accent:#B23A2E;--col:1080px;--pad:32px;--r:0;--display-w:400;--display-track:-.01em}
/* ---------- 23 · two registers (metrics · dark) ---------- */
[data-variant="w"]{--bg:#08090C;--surface:#0E0F13;--ink1:#E4E4EA;--ink2:#7E8189;--ink3:#4F525A;
  --rule:rgba(255,255,255,.08);--rule-hot:rgba(255,255,255,.14);--wash:rgba(255,255,255,.05);
  --accent:#5BE49B;--col:1120px;--pad:28px;--r:6px;--display-w:500;--display-track:-.03em}
/* ---------- 24 · stop conditions (instrument · light) ---------- */
[data-variant="x"]{--bg:#F1F0EC;--surface:#FBFAF7;--ink1:#1F2326;--ink2:#6A6E71;--ink3:#9B9C99;
  --rule:#DEDCD5;--rule-hot:#C9C6BC;--wash:#E8E6DF;
  --accent:#E8622A;--col:1080px;--pad:32px;--r:14px;--display-w:500;--display-track:-.028em}

/* ---------- 25 · contact sheet (gallery · light) ---------- */
[data-variant="y"]{--bg:#F4F3EF;--surface:#FFFFFF;--ink1:#26251F;--ink2:#65635B;--ink3:#9B988E;
  --rule:#DFDCD2;--rule-hot:#C7C3B7;--wash:#EAE8E0;
  --accent:#B23A2E;--col:1300px;--pad:32px;--r:0;--display-w:400;--display-track:-.01em}
/* ---------- 26 · clash matrix (matrix · dark) ---------- */
[data-variant="z"]{--bg:#0A0A0D;--surface:#101014;--ink1:#EDEDEE;--ink2:#8A8D92;--ink3:#55575C;
  --rule:rgba(255,255,255,.09);--rule-hot:rgba(255,255,255,.17);--wash:rgba(255,255,255,.06);
  --accent:#5B8CFF;--col:1180px;--pad:28px;--r:0;--display-w:500;--display-track:-.028em}
/* ---------- 27 · a real run (frozen interaction · dark) ---------- */
[data-variant="A"]{--bg:#07080A;--surface:#0D0F12;--ink1:#E6E8EA;--ink2:#7E838A;--ink3:#4E535A;
  --rule:rgba(255,255,255,.08);--rule-hot:rgba(255,255,255,.14);--wash:rgba(255,255,255,.05);
  --accent:#5BE49B;--col:1080px;--pad:28px;--r:10px;--display-w:500;--display-track:-.03em}

/* ---------- 28 · works with (marquee · light) ---------- */
[data-variant="B"]{--bg:#F7F7F8;--surface:#FFFFFF;--ink1:#2C2C2E;--ink2:#6B7280;--ink3:#A0A4AC;
  --rule:#E6E6E9;--rule-hot:#D4D4D9;--wash:#EFEFF1;
  --accent:#3770E9;--col:1400px;--pad:0px;--r:999px;--display-w:500;--display-track:-.026em}
/* ---------- 29 · the measured page (spec sheet · light) ---------- */
[data-variant="C"]{--bg:#FAFAFA;--surface:#FFFFFF;--ink1:#3A3A3A;--ink2:#6B7280;--ink3:#9AA0A8;
  --rule:#E8E8E8;--rule-hot:#D8D8D8;--wash:#F1F1F1;
  --accent:#3770E9;--col:1120px;--pad:36px;--r:0;--display-w:600;--display-track:-.022em}
/* ---------- 30 · both modes (comparison · light shell) ---------- */
[data-variant="D"]{--bg:#EFEFF1;--surface:#FFFFFF;--ink1:#26262A;--ink2:#6A6D75;--ink3:#9A9DA5;
  --rule:#E0E0E4;--rule-hot:#CDCDD3;--wash:#E7E7EB;
  --accent:#3770E9;--col:1240px;--pad:32px;--r:12px;--display-w:500;--display-track:-.026em}

*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
html{background:var(--bg);color-scheme:dark}
[data-variant="b"],[data-variant="c"],[data-variant="f"],[data-variant="i"]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink1);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
a{color:inherit;text-decoration:none}
button{font:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* grain: every large gradient carries it (C9) */
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- the screen: one 100 svh poster ---------- */
.screen{position:relative;height:100svh;width:100%;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.col{position:relative;width:100%;max-width:var(--col);margin:0 auto;padding:0 var(--pad);display:flex;flex-direction:column;flex:1;min-height:0;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;height:56px;flex:none}
.brand{font-weight:500;letter-spacing:-.01em;font-size:15px}
.gh{font-size:13px;color:var(--ink2);transition:color 150ms ease-in-out}
.gh:hover{color:var(--ink1)}
.bottom{display:flex;align-items:center;gap:18px;height:58px;flex:none;padding-right:132px;font:400 11px/1 var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.label{letter-spacing:.08em;text-transform:uppercase}
.nums{font-size:12px;letter-spacing:0}
.nums b{font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}
.body{flex:1;min-height:0;display:flex;flex-direction:column}

h1{margin:0;font-family:var(--sans);font-weight:var(--display-w);letter-spacing:var(--display-track);line-height:1.04;text-wrap:balance;font-size:64px}
.sub{margin:16px 0 0;color:var(--ink2);font-size:17px;line-height:1.5;max-width:60ch;text-wrap:pretty}
.w{display:inline-block}
.first .w{opacity:0;filter:blur(12px);transform:translateY(8px);animation:reveal 480ms var(--ease-out) forwards}
@keyframes reveal{to{opacity:1;filter:blur(0);transform:none}}

/* ---------- command + copy (reserved width, text+icon swap, success, quiet revert) ---------- */
.cmd{display:inline-flex;align-items:center;gap:12px;height:44px;padding:0 14px 0 16px;border:1px solid var(--rule-hot);border-radius:var(--r);font:400 13px/1 var(--mono);color:var(--ink1);background:var(--surface);white-space:nowrap;max-width:100%}
.cmd .p{color:var(--ink3)}
.copy{all:unset;cursor:pointer;display:inline-grid;grid-template-columns:6ch 14px;align-items:center;gap:8px;color:var(--ink3);font:inherit;padding-left:12px;border-left:1px solid var(--rule);transition:color 150ms ease-in-out;-webkit-tap-highlight-color:transparent}
.copy:hover,.copy:focus-visible{color:var(--ink1)}
.copy .swap{display:inline-grid}
.copy .swap>span{grid-area:1/1;transition:opacity 150ms ease-in-out,transform 150ms ease-in-out,filter 150ms ease-in-out}
.copy .w2{opacity:0;transform:translateY(4px);filter:blur(2px)}
.copy[data-state="done"] .w1{opacity:0;transform:translateY(-4px);filter:blur(2px)}
.copy[data-state="done"] .w2{opacity:1;transform:none;filter:none}
.copy .ico{display:inline-grid;width:14px;height:14px}
.copy .ico svg{grid-area:1/1;width:14px;height:14px;transition:opacity 250ms ease-in-out,filter 250ms ease-in-out,transform 250ms ease-in-out}
.copy .i-check{opacity:0;transform:scale(.25);filter:blur(2px);stroke-dasharray:14;stroke-dashoffset:14}
.copy[data-state="done"]{color:var(--success)}
.copy[data-state="done"] .i-copy{opacity:0;transform:scale(.25);filter:blur(2px)}
.copy[data-state="done"] .i-check{opacity:1;transform:none;filter:none;animation:draw 500ms cubic-bezier(.22,1,.36,1) 80ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- transport: fixed viewport chrome, ONE position, ONE skin (lock R3) ----------
   It is chrome, not content: it never takes a direction's palette and never moves. */
.ctl{position:fixed;right:24px;bottom:20px;z-index:50;display:inline-flex;align-items:center;gap:2px;padding:3px;
  border-radius:999px;background:rgba(128,128,134,.14);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  box-shadow:inset 0 0 0 1px rgba(128,128,134,.32)}
.cb{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;width:30px;height:30px;border-radius:999px;
  color:#8E8E94;transition:background 150ms ease-in-out;-webkit-tap-highlight-color:transparent}
.cb:hover,.cb:focus-visible{background:rgba(128,128,134,.20)}
.cb svg{width:14px;height:14px;display:block}
.cb .ico{display:grid;width:14px;height:14px}
.cb .ico svg{grid-area:1/1;transition:opacity 250ms ease-in-out,filter 250ms ease-in-out,transform 250ms ease-in-out}
.cb .i-play{opacity:0;transform:scale(.25);filter:blur(2px)}
.ctl[data-paused="1"] .i-pause{opacity:0;transform:scale(.25);filter:blur(2px)}
.ctl[data-paused="1"] .i-play{opacity:1;transform:none;filter:none}

/* ---------- catalog primitives: heads, cells, ledgers, plates ---------- */
.head{margin:0;font-family:var(--sans);font-weight:var(--display-w);letter-spacing:var(--display-track);font-size:34px;line-height:1.1}
.headsub{margin:10px 0 0;color:var(--ink2);font-size:15px;max-width:56ch}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:26px}
.trio{display:grid;grid-template-columns:repeat(3,1fr)}
.cell{display:flex;flex-direction:column;gap:12px;min-width:0}
.cell h3{margin:0;font:500 16px/1.3 var(--sans);letter-spacing:-.01em}
.cell p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.5}
.spec{margin:0;padding:0;list-style:none;display:grid;gap:7px;font:400 11.5px/1.4 var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.spec b{font-weight:400;color:var(--ink2);margin-right:8px}
.rows{display:grid;gap:0}
.r{display:grid;grid-template-columns:34px 1fr auto;align-items:baseline;gap:14px;padding:9px 0;font-size:13.5px}
.r .k{font:500 11px/1.4 var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums slashed-zero}
.r .t{display:flex;align-items:baseline;gap:12px;min-width:0;white-space:nowrap}
.r .t i{flex:1;border-bottom:1px dotted var(--rule-hot);transform:translateY(-5px)}
.r .v{font:400 11.5px/1.4 var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.sw{display:flex;gap:4px}
.sw i{display:block;width:26px;height:34px;border-radius:2px}

/* ===================== A · narrow dark sharp ===================== */
[data-variant="a"] .screen{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;background-position:center top}
[data-variant="a"] .col{background:var(--bg);border-inline:1px solid var(--rule)}
[data-variant="a"] .top{border-bottom:1px solid var(--rule)}
[data-variant="a"] .bottom{border-top:1px solid var(--rule)}
[data-variant="a"] .copyblock{min-width:0}
[data-variant="a"] .cmd{margin-top:28px}
[data-variant="a"] .body{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);align-items:center;gap:36px;padding-bottom:1vh}
[data-variant="a"] h1{font-size:44px}
[data-variant="a"] .sub{font-size:16.5px;max-width:34ch}
[data-variant="a"] .cmd{margin-top:32px}
[data-variant="a"] .copyblock{min-width:0}
[data-variant="a"] .plate{min-width:0;display:flex;align-items:center;justify-content:center;overflow:visible}
[data-variant="a"] .core{width:100%;max-width:540px;height:auto;max-height:76vh;display:block}
[data-variant="a"] .core *{vector-effect:non-scaling-stroke}
[data-variant="a"] .core .v{font:500 12px/1 var(--mono);fill:var(--accent);font-variant-numeric:tabular-nums}
[data-variant="a"] .core .lb{font:400 10.5px/1 var(--mono);fill:#9296A0;font-variant-numeric:tabular-nums;letter-spacing:.02em}
[data-variant="a"] .core .lb.dim{fill:#666A73}
[data-variant="a"] .core .lb.hot{fill:#C9CCD4}
[data-variant="a"] .core .sweep{animation:coresweep 9s linear infinite}
@keyframes coresweep{from{transform:translateY(90px)}to{transform:translateY(640px)}}

/* ===================== B · wide light pastel ===================== */
[data-variant="b"] .screen{background:
  radial-gradient(125% 60% at 50% 112%,#D8E1FF 0%,#E6ECFF 36%,rgba(230,236,255,0) 72%),
  linear-gradient(180deg,#FBF7FF 0%,#F6F5FD 52%,#EEF1FC 100%)}
[data-variant="b"] .screen::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(126% 61% at 50% 112%,transparent 58.5%,rgba(255,255,255,.9) 60.6%,rgba(255,255,255,0) 65%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 26%,#000 74%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 26%,#000 74%,transparent 100%)}
[data-variant="b"] .body{align-items:center;justify-content:center;text-align:center;padding-bottom:4vh}
[data-variant="b"] h1{font-size:84px;letter-spacing:-.03em}
[data-variant="b"] .sub{margin-top:20px;font-size:18px}
[data-variant="b"] .pebble{margin-top:40px;background:#fff;border-radius:28px;corner-shape:squircle;box-shadow:0 24px 48px -12px rgba(50,70,130,.14);padding:10px}
[data-variant="b"] .cmd{border:0;background:transparent;height:44px;padding:0 6px 0 14px;font-size:14px}

/* ===================== C · paper & print ===================== */
[data-variant="c"] .col{padding-bottom:0}
[data-variant="c"] .body{padding:22px 0 26px}
[data-variant="c"] .mat{position:relative;flex:1;min-height:0;background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column}
[data-variant="c"] .mat .in{position:relative;flex:1;min-height:0;padding:76px 56px 48px;display:flex;flex-direction:column;justify-content:flex-start}
[data-variant="c"] h1{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;font-size:72px;line-height:1;color:#2E2E2E}
[data-variant="c"] .sub{margin-top:18px;color:#6B6B6B;font-size:17px}
[data-variant="c"] .cmd{margin-top:32px;align-self:flex-start;border-color:var(--rule);background:#fff}
[data-variant="c"] .meta{position:absolute;right:56px;top:84px;font:400 11px/1 var(--mono);color:#9C9A94;font-variant-numeric:tabular-nums slashed-zero;letter-spacing:0}
[data-variant="c"] .meta b{font-weight:500;color:#6B6B6B}
[data-variant="c"] .slab{position:relative;flex:none;height:28%;min-height:120px;overflow:hidden;background:linear-gradient(118deg,#F27BB4 0%,#D86AB8 38%,#A757C4 70%,#7A4EC9 100%)}
[data-variant="c"] .slab::before{content:"";position:absolute;inset:-40% 0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.065) 0 38px,rgba(255,255,255,0) 38px 84px);pointer-events:none}
[data-variant="c"] .slab .ht{position:absolute;inset:0;background-image:radial-gradient(rgba(28,10,40,.62) .85px,transparent 1.35px);background-size:4px 4px;mix-blend-mode:multiply;clip-path:inset(0 0 0 54%);opacity:.85}
[data-variant="c"] .slab .grain{opacity:.035}

/* G - one isometric object: the five sheets of a lock file, exploded, 2:1 dimetric line-art */
const ISO = () => {
  const W = 300, D = 210, step = 52, cx = 300, cy = 224;
  const px = (x,y) => [x - y, (x + y) / 2];                     /* 2:1 dimetric projection */
  const corners = [[0,0],[W,0],[W,D],[0,D]].map(([x,y]) => px(x,y));
  const at = (p,dy) => `${(cx+p[0]).toFixed(1)},${(dy+p[1]).toFixed(1)}`;
  const sheets = [];
  for (let i = 0; i < 5; i++){
    const top = i === 4, dy = cy - i * step, g = [];
    g.push(`<polygon points="${corners.map(p=>at(p,dy)).join(' ')}" fill="${top?'rgba(255,255,255,.05)':'rgba(255,255,255,.022)'}" stroke="${top?'#8E8E93':'#6E6E72'}" stroke-width="1"/>`);
    if (top) g.push(`<path d="M${at(corners[3],dy).replace(',',' ')}L${at(corners[2],dy).replace(',',' ')}" stroke="#fff" stroke-width="1.4"/>`);
    const bar = (x,y,w,h,fill) => `<polygon points="${[[x,y],[x+w,y],[x+w,y+h],[x,y+h]].map(([a,b])=>at(px(a,b),dy)).join(' ')}" fill="${fill}"/>`;
    g.push(bar(30,34,176,16, top?'rgba(255,255,255,.34)':'rgba(255,255,255,.13)'));   /* the headline */
    g.push(bar(30,64,116,9,  top?'rgba(255,255,255,.16)':'rgba(255,255,255,.07)'));   /* the sub line */
    g.push(bar(30,96,92,26,  top?'rgba(255,255,255,.12)':'rgba(255,255,255,.05)'));   /* the command */
    if (top) g.push(corners.map(p=>`<rect x="${(cx+p[0]-3).toFixed(1)}" y="${(dy+p[1]-3).toFixed(1)}" width="6" height="6" fill="#1A1A1C" stroke="#fff" stroke-width="1"/>`).join(''));
    g.push(`<text class="lb${top?' hot':''}" x="${(cx+corners[1][0]+16).toFixed(1)}" y="${(dy+corners[1][1]+4).toFixed(1)}">0${5-i}</text>`);
    sheets.push(g.join(''));
  }
  const guides = corners.map(p=>`<path d="M${(cx+p[0]).toFixed(1)} ${(cy+p[1]+22).toFixed(1)}V${(cy+p[1]-4*step-18).toFixed(1)}"/>`).join('');
  const grid = [];
  for (let i = -2; i <= 8; i++){
    const a = px(i*60,-80), b = px(i*60,D+150), c = px(-110,i*60), d = px(W+170,i*60);
    grid.push(`<path d="M${(cx+a[0]).toFixed(1)} ${(cy+a[1]).toFixed(1)}L${(cx+b[0]).toFixed(1)} ${(cy+b[1]).toFixed(1)}"/>`);
    grid.push(`<path d="M${(cx+c[0]).toFixed(1)} ${(cy+c[1]).toFixed(1)}L${(cx+d[0]).toFixed(1)} ${(cy+d[1]).toFixed(1)}"/>`);
  }
  const y1 = cy + corners[3][1], y2 = y1 - step, lx = cx + corners[3][0] - 24;
  return `<svg class="iso" viewBox="0 0 660 500" fill="none" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
    <g stroke="rgba(255,255,255,.05)" stroke-width="1" stroke-dasharray="1 7">${grid.join('')}</g>
    <g stroke="#3F3F43" stroke-width="1" stroke-dasharray="3 4">${guides}</g>
    ${sheets.join('')}
    <g stroke="#5A5A5E" stroke-width="1">
      <path d="M${lx} ${y1.toFixed(1)}h12M${lx} ${y2.toFixed(1)}h12"/>
      <path d="M${lx+6} ${y1.toFixed(1)}V${y2.toFixed(1)}"/>
    </g>
    <text class="lb" x="${lx-6}" y="${((y1+y2)/2+3).toFixed(1)}" text-anchor="end">52</text>
  </svg>`;
};

  j: f => `<div class="col">${TOP()}<div class="stage"><h2 class="head${f?' first':''}">How it runs</h2><div class="trio">${C.steps.map(([n,t2,p2,sp],ix)=>`<div class="cell"><span class="n">FIG. ${n}</span><div class="fig">${FIGS[['discover','interview','lock'][ix]]}</div><h3>${t2}</h3><p>${p2}</p><ul class="spec">${sp.map(x=>`<li><b>${x.split(' ')[0]}</b>${x.split(' ').slice(1).join(' ')}</li>`).join('')}</ul></div>`).join('')}</div></div>${BOTTOM('j')}</div>`,

  /* K - feature trio, pebble dissolve with floating fragments (Triopixels-2089) */
  k: f => `<div class="col">${TOP()}<div class="stage"><h2 class="head${f?' first':''}">What it hands you</h2><div class="trio">${C.out.map(function(o,ix){return `<div class="peb"><div class="viz">${KFIG[ix]}</div><div class="txt"><h3>${o[0]}</h3><p>${o[1]}</p></div></div>`;}).join('')}</div></div>${BOTTOM('k')}</div>`,

  /* L - ledger sheet with dotted leaders (basit_designs-2089995, yurygok-2089624) */
  l: f => `<div class="col">${TOP()}<div class="body"><div class="sheet"><div class="hd"><h2>The twelve constants</h2><span>enforced always · asked never</span></div><div class="rows">${C.consts.map(([k2,t2,v])=>`<div class="r"><span class="k">${k2}</span><span class="t"><span>${t2}</span><i></i></span><span class="v">${v}</span></div>`).join('')}</div><div class="band" aria-hidden="true"></div></div></div>${BOTTOM('l')}</div>`,

  /* M - gallery of family plates over one processed chroma field (kevserctk-2090) */
  m: f => `<div class="mosaic" aria-hidden="true"></div><div class="grain"></div><div class="col">${TOP()}<div class="stage"><h2 class="head${f?' first':''}">Eight families</h2><div class="plates">${C.fams.map(([id,nm,sw,ct])=>`<div class="pl"><span class="id">${id}</span><div class="sw">${sw.map(c=>`<i style="background:${c}"></i>`).join('')}</div><h3>${nm}</h3><small>${ct} references</small></div>`).join('')}</div></div>${BOTTOM('m')}</div>`,

  /* N - metrics, one bespoke chart form invented for this data (yurygok-2089624) */
  n: f => `<div class="col">${TOP()}<div class="stage"><h2 class="head${f?' first':''}">Where the fifty-one sit</h2><p class="headsub">Membership by family. A reference belongs to one or two, so the dots outnumber the corpus.</p><div class="plot">${C.fams.map(([,nm,,ct])=>`<span class="fid">${nm}</span><span class="dots">${Array.from({length:ct},()=>'<i></i>').join('')}</span><span class="ct">${ct}</span>`).join('')}</div></div>${BOTTOM('n')}</div>`,

  /* O - one frozen product fragment, held mid-answer with real values */
  o: f => `<div class="col">${TOP()}<div class="body" style="justify-content:center"><div class="frag"><div class="bar"><span>drawn-to · question 3 of 8</span><span>weighted multi-select</span></div><div class="q">Which directions should the blend carry?</div><div class="opts"><div class="op on"><span class="box"></span><span>Editorial Monochrome</span><span class="wt">70</span></div><div class="op on"><span class="box"></span><span>Staged Atmosphere</span><span class="wt">20</span></div><div class="op on"><span class="box"></span><span>Blueprint Sheet</span><span class="wt">10</span></div><div class="op"><span class="box"></span><span>Soft Pastel Stage</span><span class="wt">0</span></div></div><div class="ft"><span>clash check: none</span><span><b>100</b> / 100</span></div></div></div>${BOTTOM('o')}</div>`,

  /* P - chapters: numbered index rail + one panel (piyushsphere-2089714) */
  p: f => `<div class="col">${TOP()}<div class="body"><div class="chap"><div class="rail">${C.six.map(([ix,lb],i)=>`<div class="st${i===2?' on':''}" data-step="${i}" role="button" tabindex="0"><span class="ix">${ix}</span><span class="lb">${lb}</span></div>`).join('')}</div><div class="panel" data-swap="in"><div class="swapzone"><div><h3>${C.six[2][1]}</h3><p>${C.six[2][2]}</p><ul class="spec">${C.six[2][3].map(([k,v])=>`<li><b>${k}</b>${v}</li>`).join('')}</ul></div></div></div></div></div>${BOTTOM('p')}</div>`,

  /* Q - 2x2 outlined bento, one focal and three ghosted (C11) */
  q: f => `<div class="col">${TOP()}<div class="stage"><h2 class="head${f?' first':''}">Beyond the direction</h2><div class="bento">${C.pillars.map(([t2,p2,ml,fo])=>`<div class="bc${fo?' focal':''}"><h3>${t2}</h3><p>${p2}</p><ul class="ml">${ml.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div></div>${BOTTOM('q')}</div>`,

  /* R - instrument HUD: segmented gauge reading the corpus (recentdesign-2089) */
  r: f => `<div class="col">${TOP()}<div class="body" style="justify-content:center;gap:26px">${GAUGE()}<div class="reads"><span>FAMILIES <b>08</b></span><span>CONSTANTS <b>12</b></span><span>RECIPES <b>32</b></span></div></div>${BOTTOM('r')}</div>`,

  /* S - gallery of paper slips: revisions never erase (AlexandruDranga-2090) */
  s: f => `<div class="grain"></div><div class="col">${TOP()}<div class="stage"><h2 class="head${f?' first':''}">Revisions add, never erase</h2><div class="slips">${C.rev.map(([rv,t2,p2])=>`<div class="slip"><i class="cm2 a"></i><i class="cm2 b"></i><span class="rv">${rv}</span><h3>${t2}</h3><p>${p2}</p></div>`).join('')}</div></div>${BOTTOM('s')}</div>`,

  /* 21 - comparison. One frame, one travelling divider: the only variable is the library. */
  u: f => `<div class="col">${TOP()}<div class="body"><h2 class="head${f?' first':''}">Same model. Same brief.</h2><p class="headsub">Two agents, the same five-feature brief, the same empty folder. One had a well-engineered skill with an empty knowledge layer. The other had this library.</p><div class="diptych"><img src="assets/proof-same-model-same-brief.jpg" alt="Left: a competent anonymous dark bento built without a taste library. Right: the same model with a divider-cut, radius-zero, numbered section carrying instrument illustrations."><i class="cut"><img src="assets/proof-same-model-same-brief.jpg" alt=""></i><i class="bar"></i></div><div class="dcap"><span>without the library</span><span><b>one variable</b></span><span>with it</span></div></div>${BOTTOM('u')}</div>`,

  /* 22 - ledger of refusals. The rule through each line is the device. */
  v: f => `<div class="col">${TOP()}<div class="body"><h2 class="head${f?' first':''}">What it will not ship</h2><div class="no">${C.refuse.map(function(r){return '<i><em>'+r[0]+'</em><s>'+r[1]+'</s></i>';}).join('')}</div><p class="nofoot">ten of them, checked against every render before handoff</p></div>${BOTTOM('v')}</div>`,

  /* 23 - metrics. Two runners, and the argument is that one never accelerates. */
  w: f => `<div class="col">${TOP()}<div class="body"><h2 class="head${f?' first':''}">Two registers, never mixed.</h2><div class="reg"><div class="a"><div class="lab"><span><b>ambient</b> &middot; the background is alive</span><span>linear &middot; constant velocity &middot; 4 s</span></div><div class="tr">${[1,2,3,4,5,6,7].map(function(i){return '<i class="tk" style="left:'+(i*12.5)+'%"></i>';}).join('')}<i class="dot"></i></div></div><div class="b"><div class="lab"><span><b>interaction</b> &middot; something answered you</span><span>eased &middot; 150-800 ms &middot; 2.6 s cycle</span></div><div class="tr">${[1,2,3,4,5,6,7].map(function(i){return '<i class="tk" style="left:'+(i*12.5)+'%"></i>';}).join('')}<i class="dot"></i></div></div></div><p class="regfoot">an eased loop reads as a machine pretending to breathe &middot; never ease an infinite loop</p></div>${BOTTOM('w')}</div>`,

  /* 24 - instrument. A rotary with four detents; the reading is the stop condition. */
  x: f => `<div class="col">${TOP()}<div class="body"><div class="knob">${KNOB()}</div><div><h2 class="head${f?' first':''}">When it stops</h2><div class="stops">${C.stops.map(function(st,i){return '<button type="button" data-stop="'+i+'" aria-pressed="'+(i===0)+'"><i>'+st[0]+'</i><span>'+st[1]+'<small>'+st[2]+'</small></span></button>';}).join('')}</div></div></div>${BOTTOM('x')}</div>`,

  /* 25 - gallery. Fifty-one tiles, one per post; the fill is the mode it was read in. */
  y: f => `<div class="col">${TOP()}<div class="body"><h2 class="head${f?' first':''}">Read frame by frame, all fifty-one</h2><div class="sheetgrid">${C.sheet.split(' ').map(function(t){return '<span class="t '+t[1]+'"><i style="width:'+({b:14,s:11,f:9,c:7,h:13,i:8,d:12,r:5,l:10}[t[0]]||9)+'px;height:'+({b:4,s:9,f:9,c:4,h:3,i:7,d:8,r:5,l:6}[t[0]]||5)+'px"></i></span>';}).join('')}<i class="scan"></i></div><div class="leg"><span><em style="background:#FFFDF9"></em><b>22</b> light</span><span><em style="background:#26251F;border-color:#26251F"></em><b>19</b> dark</span><span><em style="background:linear-gradient(135deg,#FFFDF9 0 50%,#26251F 50% 100%)"></em><b>5</b> both</span><span><em style="background:#FFFDF9;background-image:repeating-linear-gradient(45deg,#C7C3B7 0 1px,transparent 1px 5px)"></em><b>5</b> mixed</span><span>the mark inside is what the post shows</span></div></div>${BOTTOM('y')}</div>`,

  /* 26 - matrix. Eight families against themselves; the marks are measured co-occurrence. */
  z: f => `<div class="col">${TOP()}<div class="body"><div class="mx"><span></span>${C.fams8.map(function(n){return '<span class="hd"><span>'+n.split(' ')[0]+'</span></span>';}).join('')}${C.fams8.map(function(n,r){return '<span class="rw">'+n+'</span>'+C.fams8.map(function(_,c){
      if (r===c) return '<button class="c self" disabled></button>';
      var k = C.pairs[r+'-'+c] || C.pairs[c+'-'+r];
      return '<button type="button" class="c '+(k?k[0]:'')+'" data-p="'+(k?(C.pairs[r+'-'+c]?r+'-'+c:c+'-'+r):'')+'">'+(k&&k[0]==='ok'?'<i></i>':'')+'</button>';
    }).join('');}).join('')}</div><div class="read"><span class="k">HOVER A CELL</span><h3 id="mxh">Which blends the corpus actually contains</h3><p id="mxp">Eight families, twenty-eight possible pairs. Five are proven by references that use both at once. Three never co-occur, and the reason is always physics, not taste.</p><span class="tag" id="mxt">5 proven &middot; 3 clash &middot; 20 untested</span></div></div>${BOTTOM('z')}</div>`,

  /* 27 - frozen interaction. A real run, one line at a time. */
  A: f => `<div class="col">${TOP()}<div class="body"><div class="term"><div class="bar"><i></i><i></i><i></i><span>a real run</span></div><div class="log">${C.run.map(function(l,i){return l[0]==='sp'?'<div class="sp"></div>':'<div class="'+l[0]+'" data-i="'+i+'">'+(l[0]==='p'?'<em>$</em>':'')+l[1]+'</div>';}).join('')}</div></div></div>${BOTTOM('A')}</div>`,

  /* 28 - marquee. Two belts, opposite directions, linear; the last chip is the real claim. */
  B: f => `<div class="col">${TOP()}<div class="body"><h2 class="head${f?' first':''}">It runs wherever the agent reads its skills.</h2><p class="headsub">A folder of markdown and nothing else. No runtime, no service, no account.</p><div class="belt">${BELT(0)}</div><div class="belt r">${BELT(1)}</div></div>${BOTTOM('B')}</div>`,

  /* 29 - spec sheet. Seven measured containers as dimension chains, longest first. */
  C: f => `<div class="col">${TOP()}<div class="body"><h2 class="head${f?' first':''}">Measured off the shipped pages.</h2><p class="headsub">Container widths read at 1440 from seven production sites. Nothing here is a preference; it is what they actually set.</p><div class="meas">${C.sites.map(function(st){return '<div class="m'+(st[0]==='Vercel'?' hot':'')+'"><span class="s">'+st[0]+'</span><span class="ch"><i style="width:'+((st[1]-1100)/(1440-1100)*82+18).toFixed(1)+'%"></i></span><span class="v">'+st[1]+'</span></div>';}).join('')}</div><div class="cfoot"><span>one container <b>1200-1400</b></span><span>section air <b>96-208</b></span><span>three type sizes <b>only</b></span><span>body grey, never white</span></div></div>${BOTTOM('C')}</div>`,

  /* 30 - comparison. Not one skeleton dimmed: two skeletons, each material re-derived. */
  D: f => `<div class="col">${TOP()}<div class="body"><h2 class="head${f?' first':''}">Both modes, re-derived.</h2><div class="pair"><div class="sk lt"><span class="cap">LIGHT</span>${[0,1,2,3].map(function(i){return '<div class="row" data-m="'+i+'"><b style="width:'+[62,48,70,54][i]+'%"></b><b class="'+(i===1?'ac':'')+'" style="width:'+[38,26,44,32][i]+'%"></b></div>';}).join('')}</div><div class="mid">${C.modes.map(function(m,i){return '<button type="button" data-mode="'+i+'" aria-pressed="'+(i===1)+'"><i>'+m[0]+'</i><span>'+m[1]+'</span></button>';}).join('')}</div><div class="sk dk"><span class="cap">DARK</span>${[0,1,2,3].map(function(i){return '<div class="row" data-m="'+i+'"><b style="width:'+[62,48,70,54][i]+'%"></b><b class="'+(i===1?'ac':'')+'" style="width:'+[38,26,44,32][i]+'%"></b></div>';}).join('')}</div></div><p class="dfoot" id="dfoot">${C.modes[1][2]} &nbsp;/&nbsp; ${C.modes[1][3]}</p></div>${BOTTOM('D')}</div>`,

  /* T - the close: one lit line, the anchor statement returns */
  t: f => `<div class="col">${TOP()}<div class="body">${H1('t',f)}${CMD()}</div>${BOTTOM('t')}</div><i class="lit2" aria-hidden="true"></i>`
};

/* ============================ engine ============================ */
const params = new URLSearchParams(location.search);
const still = params.has('still');
let paused = still || reduce;
let idx = Math.max(0, ORDER.indexOf(params.get('v') || (location.hash||'#').slice(1)));
let first = true, timer = null;
const app = document.getElementById('app');
const live = document.getElementById('live');
const dock = document.getElementById('chrome');
dock.innerHTML = CTL(paused);

/* per-screen ambient beats. Ambient register only: constant cadence, eased swap,
   nothing that re-stages the screen on arrival (C12), everything stopped under reduced motion. */
let beats = [];
function stopBeats(){ beats.forEach(clearInterval); beats = []; }
const BEAT = {
  D: function(){
    const btns = document.querySelectorAll('.mid button'), foot = document.getElementById('dfoot');
    if (!btns.length) return;
    function pick(n){
      btns.forEach(function(b,i){ b.setAttribute('aria-pressed', i === n); });
      document.querySelectorAll('.sk .row').forEach(function(r){ r.classList.toggle('on', +r.dataset.m === n); });
      document.querySelectorAll('.sk .row b:nth-child(2)').forEach(function(b,i){ b.classList.toggle('ac', (i % 4) === n); });
      foot.innerHTML = C.modes[n][2] + ' &nbsp;/&nbsp; ' + C.modes[n][3];
    }
    document.querySelector('.mid').addEventListener('click', function(e){
      const b = e.target.closest('button'); if (b) pick(+b.dataset.mode);
    });
    if (reduce) return;
    var n = 1;
    beats.push(setInterval(function(){ n = (n + 1) % C.modes.length; pick(n); }, 3000));
  },
  z: function(){
    const cells = document.querySelectorAll('.mx .c[data-p]'), h = document.getElementById('mxh'), pEl = document.getElementById('mxp'), t = document.getElementById('mxt');
    const marked = [].filter.call(cells, function(c){ return c.dataset.p; });
    if (!marked.length) return;
    function show(c){
      cells.forEach(function(x){ x.classList.remove('on'); });
      if (!c){ return; }
      c.classList.add('on');
      const k = C.pairs[c.dataset.p];
      h.textContent = k[1]; pEl.textContent = k[2];
      t.textContent = k[0] === 'ok' ? 'proven by the corpus' : 'zero co-occurrence';
      t.className = 'tag ' + k[0];
    }
    document.querySelector('.mx').addEventListener('mouseover', function(e){ const c = e.target.closest('.c[data-p]'); if (c && c.dataset.p) show(c); });
    if (reduce) return;
    var i = 0;
    beats.push(setInterval(function(){ show(marked[i % marked.length]); i++; }, 2800));
  },
  A: function(){
    const lines = document.querySelectorAll('.term .log div[data-i]');
    if (!lines.length) return;
    if (reduce){ lines.forEach(function(l){ l.classList.add('in'); }); return; }
    var n = 0;
    function step(){
      if (n >= lines.length){ n = 0; lines.forEach(function(l){ l.classList.remove('in'); }); return; }
      lines[n].classList.add('in'); n++;
    }
    step();
    beats.push(setInterval(step, 620));
  },
  x: function(){
    const stops = document.querySelectorAll('.stops button'), ptr = document.querySelector('.knob .ptr'), dets = document.querySelectorAll('.knob .det');
    if (!stops.length || !ptr) return;
    function pick(n){
      stops.forEach(function(b,i){ b.setAttribute('aria-pressed', i === n); });
      ptr.style.transform = 'rotate(' + (n * 90) + 'deg)';
      dets.forEach(function(d,i){ d.classList.toggle('on', i === n * 10); });
    }
    document.querySelector('.stops').addEventListener('click', function(e){
      const b = e.target.closest('button'); if (b) pick(+b.dataset.stop);
    });
    if (reduce) return;
    var n = 0;
    beats.push(setInterval(function(){ n = (n + 1) % stops.length; pick(n); }, 3400));
  },
  p: function(){
    const rail = document.querySelector('.rail'), panel = document.querySelector('.panel');
    if (!rail || !panel) return;
    const zone = panel.querySelector('.swapzone');
    let i = 2;
    function paint(n){
      i = (n + C.six.length) % C.six.length;
      rail.querySelectorAll('.st').forEach(function(el,k){ el.classList.toggle('on', k === i); });
      panel.dataset.swap = 'out';
      setTimeout(function(){
        const st = C.six[i];
        zone.innerHTML = '<div><h3>' + st[1] + '</h3><p>' + st[2] + '</p><ul class="spec">' +
          st[3].map(function(kv){ return '<li><b>' + kv[0] + '</b>' + kv[1] + '</li>'; }).join('') + '</ul></div>';
        panel.dataset.swap = 'in';
      }, reduce ? 0 : 180);
    }
    rail.addEventListener('click', function(e){ const st = e.target.closest('.st'); if (st) paint(+st.dataset.step); });
    rail.addEventListener('keydown', function(e){
      if (e.key !== ' ' && e.key !== 'Enter') return;
      const st = e.target.closest('.st'); if (!st) return;
      e.preventDefault(); e.stopPropagation(); paint(+st.dataset.step);
    });
    if (reduce) return;
    beats.push(setInterval(function(){ paint(i + 1); }, 2200));
  }
};
function render(v){
  stopBeats();
  document.documentElement.dataset.variant = v;
  app.innerHTML = `<main class="screen">${SCREEN[v](first)}</main>`;
  if (first) countUp();        /* C12: only the first paint animates - every later skin arrives composed */
  first = false;
  if (BEAT[v]) BEAT[v]();
}
function go(v){
  const run = () => render(v);
  if (document.startViewTransition && !reduce) document.startViewTransition(run); else run();
  history.replaceState(null,'', '#'+v);
}
function next(d){ idx = (idx + (d||1) + ORDER.length) % ORDER.length; go(ORDER[idx]); startTimer(); }
function startTimer(){ stopTimer(); if (paused) return; timer = setInterval(function(){ next(1); }, 5000); }
function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } }
function setPaused(p){
  paused = p; paused ? stopTimer() : startTimer();
  const ctl = document.querySelector('.ctl'); if (!ctl) return;
  ctl.dataset.paused = paused ? 1 : 0;
  const tog = ctl.querySelector('.tog');
  if (tog){ tog.setAttribute('aria-pressed', paused ? 'true' : 'false'); tog.setAttribute('aria-label', paused ? 'Resume the cycle' : 'Pause the cycle'); }
  live.textContent = paused ? 'Cycle paused' : 'Cycle running';
}
function copyCmd(btn){
  if (navigator.clipboard) navigator.clipboard.writeText(C.cmd);
  btn.dataset.state = 'done'; live.textContent = 'Copied';
  clearTimeout(btn._t); btn._t = setTimeout(function(){ btn.dataset.state = 'idle'; }, 1600);
}
function countUp(){
  if (reduce) return;
  document.querySelectorAll('[data-count]').forEach(function(el){
    const end = +el.dataset.count, t0 = performance.now(), dur = 1100;
    const tick = function(t){ const p = Math.min(1,(t-t0)/dur), k = 1-Math.pow(1-p,3); el.textContent = Math.round(end*k); if (p<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
dock.addEventListener('click', function(e){
  const b = e.target.closest('.cb'); if (!b) return;
  if (b.dataset.act === 'toggle') setPaused(!paused); else next(b.dataset.act === 'next' ? 1 : -1);
});
addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') next(1);
  else if (e.key === 'ArrowLeft') next(-1);
  else if (e.key === ' ' && !e.target.closest('button,a,[role="button"]') && !reduce){ e.preventDefault(); setPaused(!paused); }
});
render(ORDER[idx]);
startTimer();
</script>
